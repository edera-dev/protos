syntax = "proto3";

package protect.control.v1;

import "protect/control/v1/common.proto";

service ControlService {
  rpc GetHostStatus(GetHostStatusRequest) returns (GetHostStatusReply);
  rpc SnoopIdm(SnoopIdmRequest) returns (stream SnoopIdmReply);
  // Snoops on the Control API, returning a stream of live Control API packets.
  // Other control API snoops will be skipped from the responses.
  rpc SnoopControl(SnoopControlRequest) returns (stream SnoopControlReply);
  rpc GetHostCpuTopology(GetHostCpuTopologyRequest) returns (GetHostCpuTopologyReply);
  rpc GetHostResources(GetHostResourcesRequest) returns (GetHostResourcesReply);

  rpc ListDevices(ListDevicesRequest) returns (ListDevicesReply);

  rpc CreateNetworkReservation(CreateNetworkReservationRequest) returns (CreateNetworkReservationReply);
  rpc DestroyNetworkReservation(DestroyNetworkReservationRequest) returns (DestroyNetworkReservationReply);
  rpc ListNetworkReservations(ListNetworkReservationsRequest) returns (stream ListNetworkReservationsReply);

  rpc PullImage(PullImageRequest) returns (stream PullImageReply);
  rpc ImportImage(stream ImportImageRequest) returns (stream ImportImageReply);
  rpc RemoveImage(RemoveImageRequest) returns (RemoveImageReply);
  rpc ListImages(ListImagesRequest) returns (stream ListImagesReply);
  rpc ListKernelVariants(ListKernelVariantsRequest) returns (ListKernelVariantsReply);

  rpc CreateZone(CreateZoneRequest) returns (CreateZoneReply);
  rpc DestroyZone(DestroyZoneRequest) returns (DestroyZoneReply);
  rpc RestartZone(RestartZoneRequest) returns (RestartZoneReply);

  rpc SuspendZone(SuspendZoneRequest) returns (SuspendZoneReply);
  rpc ResumeZone(ResumeZoneRequest) returns (ResumeZoneReply);
  rpc ForkZone(ForkZoneRequest) returns (ForkZoneReply);

  rpc ResolveZoneId(ResolveZoneIdRequest) returns (ResolveZoneIdReply);
  rpc ResolveZoneIds(ResolveZoneIdsRequest) returns (ResolveZoneIdsReply);
  rpc GetZone(GetZoneRequest) returns (GetZoneReply);
  rpc ListZones(ListZonesRequest) returns (stream ListZonesReply);
  rpc DiscoverServices(DiscoverServicesRequest) returns (stream DiscoverServicesReply);
  rpc GetSpireBundle(SpireBundleRequest) returns (SpireBundleReply);

  rpc UpdateZoneResources(UpdateZoneResourcesRequest) returns (UpdateZoneResourcesReply);
  rpc ConfigureZoneNetwork(ConfigureZoneNetworkRequest) returns (ConfigureZoneNetworkReply);

  rpc AdvertiseZoneService(AdvertiseZoneServiceRequest) returns (AdvertiseZoneServiceReply);
  rpc UnadvertiseZoneService(UnadvertiseZoneServiceRequest) returns (UnadvertiseZoneServiceReply);

  rpc AttachZoneConsole(stream ZoneConsoleRequest) returns (stream ZoneConsoleReply);
  rpc ExecuteZoneCommand(stream ExecuteZoneCommandRequest) returns (stream ExecuteZoneCommandReply);
  rpc ReadZoneMetrics(ReadZoneMetricsRequest) returns (ReadZoneMetricsReply);
  rpc MonitorZoneKernelEvents(stream MonitorZoneKernelEventRequest) returns (stream MonitorZoneKernelEventReply);

  rpc CreateWorkload(CreateWorkloadRequest) returns (CreateWorkloadReply);
  rpc StartWorkload(StartWorkloadRequest) returns (StartWorkloadReply);
  rpc StopWorkload(StopWorkloadRequest) returns (StopWorkloadReply);
  rpc DestroyWorkload(DestroyWorkloadRequest) returns (DestroyWorkloadReply);

  rpc AttachWorkloadConsole(stream WorkloadConsoleRequest) returns (stream WorkloadConsoleReply);

  rpc ResolveWorkloadId(ResolveWorkloadIdRequest) returns (ResolveWorkloadIdReply);
  rpc ResolveWorkloadIds(ResolveWorkloadIdsRequest) returns (ResolveWorkloadIdsReply);
  rpc ListWorkloads(ListWorkloadsRequest) returns (stream ListWorkloadsReply);
  rpc GetWorkload(GetWorkloadRequest) returns (GetWorkloadReply);

  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsReply);

  rpc ReadHypervisorConsole(ReadHypervisorConsoleRequest) returns (ReadHypervisorConsoleReply);
  rpc HypervisorDebugInfo(HypervisorDebugInfoRequest) returns (HypervisorDebugInfoReply);
  rpc SetHostPowerManagementPolicy(SetHostPowerManagementPolicyRequest) returns (SetHostPowerManagementPolicyReply);

  rpc DialNetworkSocket(stream DialNetworkSocketRequest) returns (stream DialNetworkSocketReply);

  rpc DialObjectCapability(stream DialObjectCapabilityRequest) returns (stream DialObjectCapabilityReply);

  rpc ListObjectCapabilities(ListObjectCapabilitiesRequest) returns (stream ListObjectCapabilitiesReply);

  rpc SpireMetadata(SpireMetadataRequest) returns (SpireMetadataReply);
}

// Requests info about the current Edera daemon/host on this machine.
message GetHostStatusRequest {}

// Identity, addressing, and version/build metadata for the Edera daemon/host.
message GetHostStatusReply {
  string host_uuid = 1;
  uint32 host_domid = 2;
  string protect_version = 3;
  string host_ipv4 = 4;
  string host_ipv6 = 5;
  string host_mac = 6;
  optional uint64 hyp_free_mem = 7;
  optional string protect_git_sha = 8;
  optional string protect_last_tag = 9;
  optional uint64 protect_revs_since_tag = 10;
  optional string protect_branch = 11;
}

// Creates a new Edera zone.
// See https://www.docs.edera.dev/overview for details
message CreateZoneRequest {
  ZoneSpec spec = 1;
}

// If `CreateZoneRequest` was successful, returns the UUID of the created
// zone, which may be retained by the caller as an identifier for future zone-related RPCs.
message CreateZoneReply {
  string zone_id = 1;
}

// Destroys an existing Edera zone, terminating any processes running in it and releasing
// any resources allocated to it.
message DestroyZoneRequest {
  string zone_id = 1;
}

message DestroyZoneReply {}

// Restart tears a zone's runtime down and re-creates it from its stored spec,
// re-launching its workloads. Valid from Failed (retry a crashed/failed zone),
// Ready, and Created (an explicit destroy-and-recreate); rejected while the
// zone is mid-transition. The daemon determines validity and refuses
// control-plane-owned (e.g. CRI/Kubernetes) zones, so no extra request fields
// are needed here.
message RestartZoneRequest {
  string zone_id = 1;
}

message RestartZoneReply {}

// Cooperatively suspends a running Edera zone. The guest is asked to quiesce its
// devices and self-suspend; the zone stays resident in memory and can later be
// resumed with `ResumeZoneRequest`.
message SuspendZoneRequest {
  string zone_id = 1;
}

message SuspendZoneReply {}

// Resumes a previously suspended Edera zone, returning it to the running state.
message ResumeZoneRequest {
  string zone_id = 1;
}

message ResumeZoneReply {}

// Forks a running Edera zone into a new memory-shared child zone (Xen VM-fork).
// The parent is cooperatively suspended for the fork and then resumed; the child
// is a copy-on-write clone that boots with its own identity (UUID, network).
message ForkZoneRequest {
  // The zone to fork from.
  string zone_id = 1;
  // Optional name for the forked child zone.
  string name = 2;
}

// Returns the UUID of the newly forked child zone.
message ForkZoneReply {
  string zone_id = 1;
}

// Resolves zone "friendly name" to a singular zone UUID, if possible. Matching is exact.
// See also `ResolveZoneIdsRequest` (plural).
message ResolveZoneIdRequest {
  string name = 1;
}

message ResolveZoneIdReply {
  string zone_id = 1;
}

// In cases where multiple zones share the same "friendly name", return a list of all
// distinct zone_ids that match that "friendly name". Matching is exact.
message ResolveZoneIdsRequest {
  string name = 1;
}

message ResolveZoneIdsReply {
  repeated string zone_ids = 1;
}

// Request detailed zone information for a given zone UUID.
message GetZoneRequest {
  string zone_id = 1;
}

message GetZoneReply {
  Zone zone = 1;
}

// List all zones being currently managed by Edera. This will include zones that are
// no longer running or in a failed state, as well as running zones.
message ListZonesRequest {}

// A streamed batch of zones. The full zone list is the concatenation of all streamed message replies.
message ListZonesReply {
  repeated Zone zones = 1;
}

// Send this control message to Edera to initiate a stream of ZoneKernelSyscallEvents
// from the specified zone_id.
// Sending `ZoneKernelEventStreamUpdate` initiates the stream, if one is not active, or updates
// parameters of the stream, if one is.
// Sending `ZoneKernelEventStreamStop` terminates the stream, if one is active.
//
// See `MonitorZonekernelEventReply` for the kinds of stream responses to expect.
message MonitorZoneKernelEventRequest {
  string zone_id = 1;
  oneof request {
    ZoneKernelEventStreamUpdate update = 3;
    ZoneKernelEventStreamStop stop = 4;
  }
}

// On new stream initiate, the first `MonitorZoneKernelEventReply` will be `ZoneKernelThreadSnapshotEvent`.
// This snapshot contains the current thread and process state of the zone, and is used by the Falco plugin
// to maintain a per-zone clientside cache of threads and processes to correlate later raw syscall events against.
//
// After that first SnapshotEvent comes through, all subsequent events should be of type SyscallEvent.
// Reinitializing the stream will send a new thread snapshot as head-of-line message, as well.
//
// Note that `zone_id` is intentionally duplicated within each
// reply type, and not simply defined once in the toplevel
// message. This makes bincoding the internal reply types as bytes easier.
message MonitorZoneKernelEventReply {
  oneof reply {
    ZoneKernelSyscallEvent syscall = 2;
    ZoneKernelThreadSnapshotEvent threadsnap = 3;
  }
}

// This request type may be sent to initiate a stream, if one is not active, or to update
// the parameters of the current stream, if one is.
// `enabled_syscalls` is the set of syscalls, by Linux syscall ID number.
// See https://github.com/torvalds/linux/blob/master/arch/x86/entry/syscalls/syscall_64.tbl
message ZoneKernelEventStreamUpdate {
  repeated uint32 enabled_syscalls = 2;
}

// Stops the current syscall event stream subscription.
message ZoneKernelEventStreamStop {}

message SpireMetadataRequest {
  string zone_id = 1;
}

message SpireMetadataReply {
  string identifier = 1;
  // The zone the identifier was resolved for. When the request omits zoneID,
  // the daemon fills it from the authenticated in-zone control channel and
  // echoes it here so the caller learns its own zone without a side channel.
  string zone_id = 2;
}

// roughly maps to libscap's `scap_threadinfo` type.
// See https://github.com/falcosecurity/libs/blob/af6e6f276bf3a847159b3cdfdbcc9efda9a620b9/userspace/libscap/scap.h#L244
message ZoneKernelThreadInfo {
  optional uint64 tid = 1;
  optional uint64 pid = 2; //threads ALWAYS have a pid(tgid) IRL - this is optional as shorthand for "fully vs partially constructed".
  optional uint64 ptid = 3;
  uint64 sid = 4;
  uint64 vpgid = 5;
  uint64 pgid = 6;
  string comm = 7;
  string exe = 8;
  string exepath = 9;
  bool exe_writable = 10;
  bool exe_upper_layer = 11;
  bool exe_lower_layer = 12;
  bool exe_from_memfd = 13;
  string args = 14;
  string env = 15;
  string cwd = 16;
  int64 fdlimit = 17;
  uint32 flags = 18;
  uint32 uid = 19;
  uint32 gid = 20;
  uint64 cap_permitted = 21;
  uint64 cap_effective = 22;
  uint64 cap_inheritable = 23;
  uint64 exe_ino = 24;
  uint64 exe_ino_ctime = 25;
  uint64 exe_ino_mtime = 26;
  uint64 exe_ino_ctime_duration_clone_ts = 27;
  uint64 exe_ino_ctime_duration_pidns_start = 28;
  uint32 vmsize_kb = 29;
  uint32 vmrss_kb = 30;
  uint32 vmswap_kb = 31;
  uint64 pfmajor = 32;
  uint64 pfminor = 33;
  optional uint64 vtid = 34;
  optional uint64 vpid = 35;
  uint64 pidns_init_start_ts = 36;
  string cgroups = 37;
  string root = 38;
  bool filtered_out = 39;
  map<uint64, ZoneKernelFdInfo> fdlist = 40;
  uint64 clone_ts = 41;
  uint32 tty = 42;
  uint32 loginuid = 43;
  uint64 lastexec_ts = 44;
  bool reaper = 45;
}

// roughly maps to libscap's `scap_fdinfo` type.
message ZoneKernelFdInfo {
  optional uint64 fd = 1; //unset fd id == invalid fd info
  uint64 inode = 2;
  ZoneKernelFdType fd_type = 3;
  ZoneKernelFdInfoData info = 4;
  // these two are not typically set at capture time,
  // but are updated at parse time.
  uint32 open_flags = 5;
  uint32 state_flags = 6;
}

enum ZoneKernelFdType {
  ZONE_KERNEL_FD_TYPE_UNKNOWN = 0;
  ZONE_KERNEL_FD_TYPE_FILE = 1;
  ZONE_KERNEL_FD_TYPE_DIRECTORY = 2;
  ZONE_KERNEL_FD_TYPE_IPV4_SOCK = 3;
  ZONE_KERNEL_FD_TYPE_IPV6_SOCK = 4;
  ZONE_KERNEL_FD_TYPE_IPV4_SERVSOCK = 5;
  ZONE_KERNEL_FD_TYPE_IPV6_SERVSOCK = 6;
  ZONE_KERNEL_FD_TYPE_FIFO = 7;
  ZONE_KERNEL_FD_TYPE_UNIX_SOCK = 8;
  ZONE_KERNEL_FD_TYPE_EVENT = 9;
  ZONE_KERNEL_FD_TYPE_UNSUPPORTED = 10;
  ZONE_KERNEL_FD_TYPE_SIGNALFD = 11;
  ZONE_KERNEL_FD_TYPE_EVENTPOLL = 12;
  ZONE_KERNEL_FD_TYPE_INOTIFY = 13;
  ZONE_KERNEL_FD_TYPE_TIMERFD = 14;
  ZONE_KERNEL_FD_TYPE_NETLINK = 15;
  ZONE_KERNEL_FD_TYPE_FILE_V2 = 16;
  ZONE_KERNEL_FD_TYPE_BPF = 17;
  ZONE_KERNEL_FD_TYPE_USERFAULTFD = 18;
  ZONE_KERNEL_FD_TYPE_IOURING = 19;
  ZONE_KERNEL_FD_TYPE_MEMFD = 20;
  ZONE_KERNEL_FD_TYPE_PIDFD = 21;
}

// Type-specific info for a file descriptor. The variant set here corresponds to
// the `ZoneKernelFdType` of the enclosing `ZoneKernelFdInfo`.
message ZoneKernelFdInfoData {
  oneof info_type {
    ZoneKernelIpv4SocketInfo ipv4_socket = 1;
    ZoneKernelIpv6SocketInfo ipv6_socket = 2;
    ZoneKernelIpv4ServerSocketInfo ipv4_server_socket = 3;
    ZoneKernelIpv6ServerSocketInfo ipv6_server_socket = 4;
    ZoneKernelUnixSocketInfo unix_socket = 5;
    ZoneKernelRegularFileInfo regular_file = 6;
    string file_name = 7;
    ZoneKernelPidFd pidfd = 8;
  }
}

enum ZoneKernelIPProtocol {
  ZONE_KERNEL_IP_PROTOCOL_UNKNOWN = 0;
  ZONE_KERNEL_IP_PROTOCOL_NA = 1;
  ZONE_KERNEL_IP_PROTOCOL_TCP = 2;
  ZONE_KERNEL_IP_PROTOCOL_UDP = 3;
  ZONE_KERNEL_IP_PROTOCOL_ICMP = 4;
  ZONE_KERNEL_IP_PROTOCOL_RAW = 5;
}

// Endpoint info for a connected IPv4 socket.
message ZoneKernelIpv4SocketInfo {
  string source_ip = 1; // IPv4 address as string
  string dest_ip = 2; // IPv4 address as string
  uint32 source_port = 3;
  uint32 dest_port = 4;
  ZoneKernelIPProtocol protocol = 5;
}

// Endpoint info for a connected IPv6 socket.
message ZoneKernelIpv6SocketInfo {
  string source_ip = 1; // IPv6 address as string
  string dest_ip = 2; // IPv6 address as string
  uint32 source_port = 3;
  uint32 dest_port = 4;
  ZoneKernelIPProtocol protocol = 5;
}

// Endpoint info for a listening IPv4 server socket.
message ZoneKernelIpv4ServerSocketInfo {
  string local_ip = 1; // IPv4 address as string
  uint32 local_port = 2;
  ZoneKernelIPProtocol protocol = 3;
}

// Endpoint info for a listening IPv6 server socket.
message ZoneKernelIpv6ServerSocketInfo {
  string local_ip = 1; // IPv6 address as string
  uint32 local_port = 2;
  ZoneKernelIPProtocol protocol = 3;
}

// Info for a unix domain socket. `source` and `destination` are opaque kernel socket
// identifiers, per libscap.
message ZoneKernelUnixSocketInfo {
  uint64 source = 1;
  uint64 destination = 2;
  string name = 3;
}

// Info for a regular open file.
message ZoneKernelRegularFileInfo {
  uint32 open_flags = 1;
  string name = 2;
  uint32 mount_id = 3;
  uint32 device = 4;
}

// Info for a pidfd: the PID of the process the fd refers to.
message ZoneKernelPidFd {
  uint64 pid = 1;
}

// Represents a captured syscall event from the zone kernel.
// Roughly maps to the Falco libscap format for generic events:
// https://falco.org/docs/reference/plugins/plugin-api-reference/#libscap-event-block-specification
message ZoneKernelSyscallEvent {
  string zone_id = 1;
  uint64 timestamp = 2;
  uint64 thread_id = 3; // TODO BML possibly not needed for plugin events.
  uint32 event_length = 4; //header + params
  string event_name = 5;
  string event_category = 6;
  uint32 event_flags = 8; // Event flags (bitmask, see `ppm_evt_flags` in falcosecurity/libs/driver/ppm_events_public.h) - not part of the raw payload but contains helpful serialization hints.
  uint32 event_type = 9; // Event type
  uint32 cpuid = 10;
  repeated ZoneKernelEventParam event_params = 7;
}

// Sent as an ACK response to a `MonitorZoneKernelEventRequest` of type `ZoneKernelEventStreamUpdate`.
// Contains a complete snapshot of zone threads, which is used by the Falco plugin to maintain a per-zone clientside
// cache of threads and processes to correlate the subsequent raw syscall event stream against.
// This is useful because e.g. if you get a `fork` syscall event from an existing thread, you can correlate the
// parent TID against the data in this snapshot to hydrate info about the parent thread, if needed or desired.
message ZoneKernelThreadSnapshotEvent {
  string zone_id = 2;
  map<uint64, ZoneKernelThreadInfo> thread_info = 1;
  uint64 zone_boot_epoch = 3; // some thread info timestamp fields are relative to this
}

// in libscap, events are packed on the wire accordingly:
// - a header
// - an arbitrary sequence of 2-or-4-byte numbers for each param, indicating param lengths
//   (4-bytes if `EF_LARGE_PAYLOAD` bitmask is set on `ppm_evt_flags`, otherwise 2)
// - an arbitrary sequence of bytes for each param, encoding param data/values.
// This represents the non-header parts of the event.
// The number of paramters, as well as whether the param lengths are represented as 2 or 4 byte numbers,
// is defined by the header in libscap, but for convenience those are colocated in this message here.
// See https://falco.org/docs/reference/plugins/plugin-api-reference/#libscap-event-block-specification
message ZoneKernelEventParam {
  string name = 1;
  uint32 param_type = 2;
  bytes param_data = 3;
  string param_pretty = 4;
  string param_type_pretty = 5;
}

message DiscoverServicesRequest {}

message DiscoverServicesReply {
  repeated ServiceEntry service_entry = 1;
}

message SpireBundleRequest {}

message SpireBundleReply {
  string bundle = 1;
}

// Client stream message for `ExecuteZoneCommand`. The first message sent must be an
// `ExecuteZoneCommandStart`; subsequent messages carry stdin data or terminal resizes.
message ExecuteZoneCommandRequest {
  oneof request {
    ExecuteZoneCommandStart start = 1;
    ExecuteZoneCommandStdin stdin = 2;
    ExecuteZoneCommandTerminalResize terminal_resize = 3;
  }
}

// Starts a process in the specified zone. If `workload_id` is set, the process is spawned
// inside that workload's container, otherwise it runs in the zone context itself.
message ExecuteZoneCommandStart {
  string zone_id = 1;
  string workload_id = 2;
  ProcessSpec process = 3;
}

// A chunk of stdin for the running process. Set `closed` to signal EOF on stdin.
message ExecuteZoneCommandStdin {
  bytes stdin = 1;
  bool closed = 2;
}

// Resizes the terminal of the running process, if it was started with a tty.
message ExecuteZoneCommandTerminalResize {
  TerminalSize size = 1;
}

// A chunk of stdout/stderr output from the running process.
message ExecuteZoneCommandOutput {
  bytes stdout = 1;
  bytes stderr = 2;
}

// Indicates the process exited with `exit_code`. This is the final reply on the stream.
message ExecuteZoneCommandExited {
  int32 exit_code = 1;
}

// Server stream message for `ExecuteZoneCommand`: output chunks as they arrive,
// terminated by an `ExecuteZoneCommandExited` when the process exits.
message ExecuteZoneCommandReply {
  oneof reply {
    ExecuteZoneCommandOutput output = 1;
    ExecuteZoneCommandExited exited = 2;
  }
}

// Client stream message for `AttachZoneConsole`. `data` is written to the zone console.
// Set `replay_history` on the first message to receive buffered console history before
// live output.
message ZoneConsoleRequest {
  string zone_id = 1;
  bytes data = 2;
  bool replay_history = 3;
}

// A chunk of zone console output.
message ZoneConsoleReply {
  bytes data = 1;
}

// Client stream message for `AttachWorkloadConsole`. Attaches to the stdio of the
// workload's main process: `stdin` bytes are forwarded to the process, `stdin_closed`
// signals stdin EOF, and `terminal_resize` resizes the process terminal, if it has one.
message WorkloadConsoleRequest {
  string workload_id = 1;
  bytes stdin = 2;
  bool stdin_closed = 3;
  TerminalSize terminal_resize = 4;
}

// A chunk of stdout/stderr output from the workload's main process.
message WorkloadConsoleReply {
  bytes stdout = 1;
  bytes stderr = 2;
}

// Subscribes to a stream of state changes for all zones and workloads on this host.
message WatchEventsRequest {}

// A single zone or workload change event.
message WatchEventsReply {
  oneof event {
    ZoneChangedEvent zone_changed = 1;
    WorkloadChangedEvent workload_changed = 2;
    AdvertiseServiceEvent advertise_service = 3;
    UnadvertiseServiceEvent unadvertise_service = 4;
  }
}

// Carries the full current state of a zone whose state has changed.
message ZoneChangedEvent {
  Zone zone = 1;
}

// Carries the full current state of a workload whose state has changed.
message WorkloadChangedEvent {
  Workload workload = 1;
}

message AdvertiseServiceEvent {
  ServiceEntry service_entry = 1;
}

message UnadvertiseServiceEvent {
  string uuid = 1;
}

// Reads the most recently collected metrics (memory, CPU, etc.) for the given zone.
// Metrics are served from a daemon-managed cache.
message ReadZoneMetricsRequest {
  string zone_id = 1;
}

// The root of the zone metrics tree. `root` is unset if no metrics are available for the
// zone (zone metrics disabled, metrics stale, etc).
message ReadZoneMetricsReply {
  MetricNode root = 1;
}

// Subscribes to a snoop stream of all IDM traffic passing
// between the daemon and zones on this host. Intended for debugging and analysis.
message SnoopIdmRequest {}

// A batch of snooped IDM packets. If the subscriber falls behind the snoop buffer,
// `skipped` reports how many packets were dropped to catch up.
message SnoopIdmReply {
  repeated SnoopIdmPacket packets = 1;
  uint64 skipped = 2;
}

// A single IDM packet. `from` and `to` are zone UUIDs (the host UUID stands in for the
// daemon side), and `packet` is the protobuf-encoded IDM message.
message SnoopIdmPacket {
  string from = 1;
  string to = 2;
  bytes packet = 3;
}

// Request to snoop the Control API traffic for this host.
message SnoopControlRequest {}

// Reply for the SnoopControl RPC, contains a batch of packets from the Control API.
message SnoopControlReply {
  // Snooped packets that were received from the Control API.
  repeated SnoopControlPacket packets = 1;
  // Number of packets that were skipped due to buffer constraints.
  uint64 skipped = 2;
}

/// Represents the form of a packet in the Control API.
enum SnoopControlPacketForm {
  SNOOP_CONTROL_PACKET_FORM_UNKNOWN = 0;
  SNOOP_CONTROL_PACKET_FORM_REQUEST = 1;
  SNOOP_CONTROL_PACKET_FORM_ERROR = 2;
  SNOOP_CONTROL_PACKET_FORM_RESPONSE = 3;
}

/// Represents a packet of data in/out of the Control API.
message SnoopControlPacket {
  // Unique identifier for the packet.
  uint64 id = 1;
  // Origin of the RPC.
  ResourceOrigin origin = 2;
  // Service name of the RPC.
  string service = 3;
  // Method name of the RPC.
  string method = 4;
  // Form of the packet.
  SnoopControlPacketForm form = 5;
  // Payload of the packet.
  string payload = 6;
  // Whether the stream is closed.
  bool closed = 7;
}

// Pulls an OCI image into the local image cache, packing it into the requested `format`.
// `overwrite_cache` forces a fresh pull and repack even if the image is already cached.
// `update` re-resolves the image reference against the registry (picking up new content
// for moving tags) instead of resolving from the local cache.
// Set `want_metadata` to receive the OCI manifest/config in the final reply.
message PullImageRequest {
  // The image to pull, given either as a literal OCI reference or as a named
  // kernel variant OCI alias the daemon resolves from its `[zone.kernel-variants]`
  // mapping in daemon.toml.
  oneof source {
    string image = 1;
    string kernel_variant = 7;
  }
  OciImageFormat format = 2;
  bool overwrite_cache = 3;
  bool update = 4;
  bool want_metadata = 5;
  OciRegistryAuthentication auth = 6;
}

// Streamed reply for `PullImageRequest`. Intermediate replies carry `progress` updates.
// The final reply carries the packed image `spec`, plus `metadata` if requested.
message PullImageReply {
  OciImageProgress progress = 1;
  OciImageSpec spec = 2;
  OciImageMetadata metadata = 3;
}

// Lists the named zone kernel variants the daemon can resolve, as configured under
// `[zone.kernel-variants]` in daemon.toml. These are the names accepted by the
// `--kernel-variant` / `dev.edera/kernel-variant` selectors.
message ListKernelVariantsRequest {}

message ListKernelVariantsReply {
  repeated KernelVariant variants = 1;
}

// A single named kernel variant: the selectable `name` and the OCI reference
// the daemon resolves it to.
message KernelVariant {
  string name = 1;
  string image = 2;
}

// Client stream message for `ImportImage`: uploads an image archive directly into the
// local image cache, as a sequence of `chunk`s with `last_chunk` set on the final one.
// The first message must carry `image`, `digest` and `format`, identifying the image
// and selecting the packed format to unpack it into.
message ImportImageRequest {
  string digest = 1;
  string image = 2;
  OciImageFormat format = 3;
  bytes chunk = 4;
  bool last_chunk = 5;
  bool overwrite_cache = 6;
  bool want_metadata = 7;
}

// Streamed reply for `ImportImage`. `accepted` indicates whether the daemon will consume
// the uploaded archive. It is `false` if a task for the same image is already active, in
// which case the upload is ignored and this stream observes the existing task's progress
// instead. As with `PullImageReply`, `progress` updates are followed by a final reply
// carrying `spec`, plus `metadata` if requested.
message ImportImageReply {
  bool accepted = 1;
  OciImageProgress progress = 2;
  OciImageSpec spec = 3;
  OciImageMetadata metadata = 4;
}

// Removes the image identified by `digest` and `format` from the local image cache.
message RemoveImageRequest {
  string digest = 1;
  OciImageFormat format = 2;
}

// `removed` indicates whether the image existed and was removed.
message RemoveImageReply {
  bool removed = 1;
}

// Lists all images currently present in the local image cache.
message ListImagesRequest {}

// A streamed batch of cached images.
message ListImagesReply {
  repeated OciImageInfo images = 1;
}

// Lists host devices available for passthrough to zones, including whether each device
// is currently claimed, and by which zone.
message ListDevicesRequest {}

// The set of known host devices.
message ListDevicesReply {
  repeated DeviceInfo devices = 1;
}

// Requests the host CPU topology.
message GetHostCpuTopologyRequest {}

// One entry per logical host CPU, describing its core/socket/node/thread placement
// and CPU class.
message GetHostCpuTopologyReply {
  repeated HostCpuTopologyInfo cpus = 1;
}

// Requests aggregate memory, CPU, and topology figures for this machine.
message GetHostResourcesRequest {}

// Memory, CPU, and topology figures for this machine. `hypervisor_*` values
// describe the whole machine as the hypervisor sees it; `host_*` values
// describe the host (dom0) that Edera runs in.
//
// Memory figures are in bytes. CPU usage is the busy fraction as a percentage
// (0-100); CPU total time is the cumulative elapsed CPU time since boot, summed
// across all logical CPUs, in nanoseconds. Core counts are physical cores; see
// GetHostCpuTopology for the per-CPU breakdown.
message GetHostResourcesReply {
  uint64 hypervisor_total_memory = 1;
  uint64 hypervisor_used_memory = 2;
  uint64 hypervisor_free_memory = 3;
  double hypervisor_cpu_usage = 4;
  uint64 hypervisor_cpu_total_time = 5;
  uint32 hypervisor_numa_nodes = 6;
  uint32 hypervisor_cpu_sockets = 7;
  uint32 hypervisor_cpu_cores = 8;

  uint64 host_total_memory = 9;
  uint64 host_used_memory = 10;
  uint64 host_free_memory = 11;
  double host_cpu_usage = 12;
  uint64 host_cpu_total_time = 13;
  uint32 host_numa_nodes = 14;
  uint32 host_cpu_sockets = 15;
  uint32 host_cpu_cores = 16;
}

// Sets the host power management policy. `scheduler` is a CPU frequency governor name,
// applied to all host CPUs. `smt_awareness` toggles SMT-aware power management.
message SetHostPowerManagementPolicyRequest {
  string scheduler = 1;
  bool smt_awareness = 2;
}

message SetHostPowerManagementPolicyReply {}

// Live-updates the CPU and memory resources of a running zone, within the resource
// bounds the zone was created with.
message UpdateZoneResourcesRequest {
  string zone_id = 1;
  ZoneResourcesSpec resources = 2;
}

message UpdateZoneResourcesReply {}

// Reads the accumulated dmesg-style hypervisor console log.
message ReadHypervisorConsoleRequest {}

// The hypervisor console log contents.
message ReadHypervisorConsoleReply {
  string data = 1;
}

// Lists all current network reservations. See `CreateNetworkReservationRequest`.
message ListNetworkReservationsRequest {}

// A streamed batch of network reservations.
message ListNetworkReservationsReply {
  repeated NetworkReservation reservations = 1;
}

// Allocates a new network reservation: a MAC address and IPv4/IPv6 assignment reserved
// ahead of zone creation. A zone can later be created against the reservation via
// `ZoneNetworkOptionsSpec.assume_network_reservation`.
message CreateNetworkReservationRequest {}

// The newly allocated reservation.
message CreateNetworkReservationReply {
  NetworkReservation reservation = 1;
}

// Releases the network reservation with the given UUID.
message DestroyNetworkReservationRequest {
  string reservation_id = 1;
}

message DestroyNetworkReservationReply {}

// Requests hypervisor debug state. Intended for debugging.
message HypervisorDebugInfoRequest {}

// Hypervisor debug state, as free-form JSON whose shape may change between versions.
message HypervisorDebugInfoReply {
  string json = 1;
}

// Creates a new workload in an existing zone (specified by `WorkloadSpec.zone_id`).
// Creating a workload does not start it, see `StartWorkloadRequest`.
message CreateWorkloadRequest {
  WorkloadSpec spec = 1;
}

// If `CreateWorkloadRequest` was successful, returns the UUID of the created workload,
// which may be retained by the caller as an identifier for future workload-related RPCs.
message CreateWorkloadReply {
  string workload_id = 1;
}

// Starts a previously created workload.
message StartWorkloadRequest {
  string workload_id = 1;
}

message StartWorkloadReply {}

// Stops a running workload. The workload process is asked to terminate gracefully, and
// is forcibly killed if it has not exited after `timeout` seconds.
message StopWorkloadRequest {
  string workload_id = 1;
  uint64 timeout = 2;
}

message StopWorkloadReply {}

// Destroys an existing workload, stopping it if necessary and releasing any resources
// allocated to it.
message DestroyWorkloadRequest {
  string workload_id = 1;
}

message DestroyWorkloadReply {}

// Resolves workload "friendly name" to a singular workload UUID, if possible. Matching is exact.
// See also `ResolveWorkloadIdsRequest` (plural).
message ResolveWorkloadIdRequest {
  string name = 1;
}

// The UUID of the workload matching the requested name.
message ResolveWorkloadIdReply {
  string workload_id = 1;
}

// In cases where multiple workloads share the same "friendly name", return a list of all
// distinct workload_ids that match that "friendly name". Matching is exact.
message ResolveWorkloadIdsRequest {
  string name = 1;
}

// The UUIDs of all workloads matching the requested name.
message ResolveWorkloadIdsReply {
  repeated string workload_ids = 1;
}

// List all workloads currently managed by Edera, across all zones. As with
// `ListZonesRequest`, this includes workloads that are no longer running or in a
// failed state, as well as running workloads.
message ListWorkloadsRequest {}

// A streamed batch of workloads. The full workload list is the concatenation of all streamed replies.
message ListWorkloadsReply {
  repeated Workload workloads = 1;
}

// Request detailed workload information for a given workload UUID.
message GetWorkloadRequest {
  string workload_id = 1;
}

// Detailed workload information for the requested workload.
message GetWorkloadReply {
  Workload workload = 1;
}

// Applies a network configuration (interfaces, routes, neighbor entries) to an existing zone.
message ConfigureZoneNetworkRequest {
  string zone_id = 1;
  ZoneNetworkConfig config = 2;
}

message ConfigureZoneNetworkReply {}

message AdvertiseZoneServiceRequest {
  string uuid = 1;
  ZoneServiceConfig config = 2;
}

message AdvertiseZoneServiceReply {}

message UnadvertiseZoneServiceRequest {
  ZoneServiceConfig config = 2;
}

message UnadvertiseZoneServiceReply {}

// Client stream message for `DialNetworkSocket`. The first message must be a
// `DialNetworkSocketStart`. Subsequent messages carry data to write to the connection.
message DialNetworkSocketRequest {
  oneof request {
    DialNetworkSocketStart start = 1;
    DialNetworkSocketData data = 2;
  }
}

// Dials a TCP connection to `address:port` from inside the specified zone's network.
// Once established, the stream acts as a bidirectional byte proxy for the connection.
message DialNetworkSocketStart {
  string zone_id = 1;
  string address = 2;
  uint32 port = 3;
}

// A chunk of connection payload bytes.
message DialNetworkSocketData {
  bytes content = 1;
}

// A chunk of bytes received from the zone-side connection.
message DialNetworkSocketReply {
  DialNetworkSocketData data = 1;
}

message DialObjectCapabilityRequest {
  oneof request {
    DialObjectCapabilityStart start = 1;
    DialObjectCapabilityData data = 2;
  }
}

// Dials the object capability published under `name`, which the daemon resolves
// to its provider zone. Once established, the stream is a bidirectional byte
// proxy carrying one capsudo session (descriptor passing is simulated over it).
message DialObjectCapabilityStart {
  string name = 1;
  // Optional attribution: the workload this call is made on behalf of, for the
  // provider's audit/policy. Empty for a direct external caller (the daemon
  // attributes those via the control-API principal).
  string caller_workload_id = 2;
}

// A chunk of capsudo session bytes sent toward the capability.
message DialObjectCapabilityData {
  bytes content = 1;
}

// A chunk of capsudo session bytes received from the capability.
message DialObjectCapabilityReply {
  DialObjectCapabilityData data = 1;
}

message ListObjectCapabilitiesRequest {}

// A streamed batch of published object capabilities. The full list is the
// concatenation of all streamed replies.
message ListObjectCapabilitiesReply {
  repeated ObjectCapabilityInfo object_capabilities = 1;
}
