syntax = "proto3";

package protect.control.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message ResourceOrigin {
  string zone_id = 1;
  string workload_id = 2;
  string user_agent = 3;
}

message Zone {
  string id = 1;
  ZoneSpec spec = 2;
  ZoneStatus status = 3;
  ResourceOrigin origin = 4;
}

// Represents a Zone.
// - If `kernel` not specified, defaults to the daemon default kernel.
// - If `initrd` not specified, defaults to the daemon default initrd.
message ZoneSpec {
  string name = 1;
  OciImageSpec kernel = 2;
  OciImageSpec initrd = 3;
  KernelOptionsSpec kernel_options = 4;
  ZoneResourcesSpec initial_resources = 5;
  repeated AnnotationSpec annotations = 6;
  repeated DeviceReferenceSpec devices = 7;
  ZoneNetworkOptionsSpec network_options = 8;
  ZoneVirtualizationOptionsSpec virtualization_options = 9;
  ZoneScratchDiskSpec scratch_disk = 10;
  repeated OciImageSpec addons = 11;
  // When set, this zone is a fork of the named parent zone; the reconciler
  // forks the child from the parent rather than building it from scratch.
  string fork_parent_zone_id = 12;
  // Configures Control API access for the zone.
  ZoneControlApiSpec control_api = 13;
  // Boots the zone from a disk image via UEFI firmware instead of the
  // container path. KVM-only; mutually exclusive with `kernel`, `initrd`,
  // `addons`, `scratch_disk` (rejected by the daemon).
  ZoneVmImageSpec vm_image = 14;
}

// Access control specification on the Control API for a zone.
enum ZoneControlApiAccess {
  // Deny access to the Control API for this zone.
  ZONE_CONTROL_API_ACCESS_DENY = 0;
  // Allow access to the Control API for this zone.
  ZONE_CONTROL_API_ACCESS_ALLOW = 1;
}

// Configures the Control API for a zone.
message ZoneControlApiSpec {
  // Controls access to the Control API.
  ZoneControlApiAccess access = 1;
}

enum ZoneResourceAdjustmentPolicy {
  ZONE_RESOURCE_ADJUSTMENT_POLICY_UNKNOWN = 0;
  ZONE_RESOURCE_ADJUSTMENT_POLICY_STATIC = 1;
  ZONE_RESOURCE_ADJUSTMENT_POLICY_DYNAMIC = 2;
}

message ZoneResourcesSpec {
  uint64 max_memory = 1;
  uint64 min_memory = 6;
  uint64 target_memory = 2;
  uint32 max_cpus = 3;
  uint32 min_cpus = 7;
  uint32 target_cpus = 4;
  VcpuAffinitiesSpecSet cpus_affinities_set = 8;
  ZoneResourceAdjustmentPolicy adjustment_policy = 5;
}

message KernelModuleParameter {
  string module = 1;
  string parameter = 2;
}

message KernelSysctlParameter {
  string key = 1;
  string value = 2;
}

message KernelOptionsSpec {
  bool verbose = 1;
  string cmdline_append = 2;
  repeated string cmdline = 3;
  repeated string modules = 4;
  repeated KernelModuleParameter module_parameters = 5;
  repeated KernelSysctlParameter sysctl_parameters = 6;
}

enum ZoneNetworkBackend {
  ZONE_NETWORK_BACKEND_DEFAULT = 0;
  ZONE_NETWORK_BACKEND_NONE = 1;
  ZONE_NETWORK_BACKEND_EXTERNAL = 2;
  ZONE_NETWORK_BACKEND_PASSTHROUGH = 3;
}

message ZoneNetworkOptionsSpec {
  string assume_network_reservation = 1;
  bool retain_network_reservation = 2;
  ZoneNetworkOptionsDnsSpec dns_config = 3;
  ZoneNetworkBackend backend = 4;
}

message ZoneNetworkOptionsDnsSpec {
  repeated string nameservers = 3;
  repeated string searches = 4;
  repeated string options = 5;
}

// Represents configurable zone options related to hypervisor virtualization.
// - `numa_nodes`: Requested vNUMA node count.
//   - 0 (default) = auto: placement is driven by vCPU vs. per-node pCPU coverage, matching legacy behavior.
//   - `>0` = exact: the daemon will hard-fail if the request cannot be satisfied with exactly this many vNUMA nodes.
message ZoneVirtualizationOptionsSpec {
  ZoneVirtualizationBackend backend = 1;
  uint32 numa_nodes = 2;
  NumaStrategy numa_strategy = 3;
}

enum ZoneVirtualizationBackend {
  ZONE_VIRTUALIZATION_BACKEND_UNKNOWN = 0;
  ZONE_VIRTUALIZATION_BACKEND_PV = 1;
  ZONE_VIRTUALIZATION_BACKEND_PVH = 2;
  ZONE_VIRTUALIZATION_BACKEND_AUTOMATIC = 3;
}

// Strategy used when expanding the selected node set beyond the seed node.
// - UNSPECIFIED is treated as COMPACT.
// - COMPACT: Expand to the nearest unselected NUMA node by SLIT distance from the already-selected set, tie-breaking by most free memory.
// - SCATTER: Expand to the most distant unselected NUMA node by SLIT distance from the already-selected set, tie-breaking by most free memory.
//   Note: SLIT distance does not guarantee separation across sockets, IMCs, or LLCs; the benefit depends on the host's physical topology.
enum NumaStrategy {
  NUMA_STRATEGY_UNSPECIFIED = 0;
  NUMA_STRATEGY_COMPACT = 1;
  NUMA_STRATEGY_SCATTER = 2;
}

message OciImageSpec {
  string digest = 1;
  OciImageFormat format = 2;
}

message OciImageMetadata {
  bytes manifest = 1;
  bytes config = 2;
}

message OciImageInfo {
  string digest = 1;
  OciImageFormat format = 2;
  repeated string names = 3;
  OciImageMetadata metadata = 4;
}

enum ProcessNamespace {
  PROCESS_NAMESPACE_MOUNT = 0;
  PROCESS_NAMESPACE_UTS = 1;
  PROCESS_NAMESPACE_IPC = 2;
  PROCESS_NAMESPACE_USER = 3;
  PROCESS_NAMESPACE_PID = 4;
  PROCESS_NAMESPACE_NET = 5;
  PROCESS_NAMESPACE_CGROUP = 6;
  PROCESS_NAMESPACE_TIME = 7;
}

message ProcessSpec {
  repeated EnvironmentVariableSpec environment = 1;
  repeated string command = 2;
  string working_directory = 3;
  bool tty = 4;
  TerminalSize terminal_size = 5;
  IdOrNameValue user = 6;
  IdOrNameValue group = 7;
  bool stdin = 8;
  bool stdout = 9;
  bool stderr = 10;
  reserved 11, 12;
  repeated int64 additional_gids = 13;
}

message MountSpec {
  string host_path = 1;
  string target_path = 2;
  bool read_only = 3;
}

message EnvironmentVariableSpec {
  string key = 1;
  string value = 2;
}

message AnnotationSpec {
  string key = 1;
  string value = 2;
}

message DeviceReferenceSpec {
  string name = 1;
}

message WorkloadBlockDeviceSpec {
  string target_path = 1;
  string device_path = 2;
