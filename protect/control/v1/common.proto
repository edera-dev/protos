}

message WorkloadPciDeviceSpec {
  string location = 1;
}

message BlockDeviceMountOptions {
  bool readonly = 1;
  string permissions = 2;
}

message ZoneStatus {
  ZoneState state = 1;
  ZoneNetworkStatus network_status = 2;
  ZoneExitStatus exit_status = 3;
  ZoneErrorStatus error_status = 4;
  string host = 5;
  uint32 domid = 6;
  ZoneResourceStatus resource_status = 7;
  google.protobuf.Timestamp created_at = 8;
  ZoneDeviceStatus device_status = 9;
  google.protobuf.Timestamp ready_at = 10;
}

enum ZoneState {
  ZONE_STATE_UNKNOWN = 0;
  ZONE_STATE_CREATING = 1;
  ZONE_STATE_CREATED = 2;
  ZONE_STATE_READY = 3;
  reserved 4;
  reserved "ZONE_STATE_EXITED";
  ZONE_STATE_DESTROYING = 5;
  ZONE_STATE_DESTROYED = 6;
  ZONE_STATE_FAILED = 7;
  ZONE_STATE_SUSPENDING = 8;
  ZONE_STATE_SUSPENDED = 9;
  ZONE_STATE_RESUMING = 10;
  ZONE_STATE_FORKING = 11;
}

enum ZoneNetworkIpVersion {
  ZONE_NETWORK_IP_VERSION_UNKNOWN = 0;
  ZONE_NETWORK_IP_VERSION_V4 = 1;
  ZONE_NETWORK_IP_VERSION_V6 = 2;
}

// NUD stands for Neighbor Unreachability Detection
// and signals how or if neighbor mapping entries will be autopruned.
enum ZoneNetworkNUDMode {
  ZONE_NETWORK_NUD_MODE_PERMANENT = 0;
  ZONE_NETWORK_NUD_MODE_NOARP = 1;
  ZONE_NETWORK_NUD_MODE_REACHABLE = 2;
  // TODO(bleggett) there are more modes but we don't care about them.
}

message ZoneNetworkIp {
  ZoneNetworkIpVersion version = 1;
  string address = 2;
  string gateway = 3;
}

message ZoneNetworkRoute {
  ZoneNetworkIpVersion version = 1;
  string source = 2;
  string destination = 3;
  string gateway = 4;
  string output_interface = 5;
  uint32 scope = 6;
  uint32 table = 7;
  uint32 protocol = 8;
  uint32 kind = 9;
  string pref_source = 10;
}

// Represents a command like
// `ip neigh add 168.254.1.1 lladdr 06:26:7a:34:d9:c5 dev eth0 nud permanent`
// See `man ip-neighbor(8)` for details.
message ZoneNetworkNeighborEntry {
  ZoneNetworkIpVersion version = 1;
  string ip_address = 2;
  string link_layer_address = 3;
  string attached_interface = 4;
  ZoneNetworkNUDMode unreachability_detection = 5;
  uint32 kind = 6;
}

message ZoneServiceConfig {
  string zone_id = 1;
  string service = 2;
}

message ZoneNetworkConfig {
  repeated ZoneNetworkInterfaceConfig interfaces = 1;
  repeated ZoneNetworkRoute routes = 2;
  repeated ZoneNetworkNeighborEntry neighbors = 3;
}

message ZoneNetworkInterfaceConfig {
  string zone_interface = 1;
  string zone_mac = 2;
  repeated ZoneNetworkIp ips = 3;
  uint32 mtu = 4;
}

message ZoneNetworkInterfaceStatus {
  string host_interface = 1;
  string zone_interface = 2;
  string zone_mac = 3;
  repeated ZoneNetworkIp ips = 4;
  uint32 mtu = 5;
}

message ZoneNetworkStatus {
  repeated ZoneNetworkInterfaceStatus interfaces = 1;
  repeated ZoneNetworkRoute routes = 2;
  repeated ZoneNetworkNeighborEntry neighbors = 3;
}

message ZoneExitStatus {
  int32 code = 1;
}

message ZoneErrorStatus {
  string message = 1;
}

message ZoneResourceStatus {
  ZoneResourcesSpec active_resources = 1;
}

message MetricNode {
  string name = 1;
  google.protobuf.Value value = 2;
  MetricFormat format = 3;
  repeated MetricNode children = 4;
}

enum MetricFormat {
  METRIC_FORMAT_UNKNOWN = 0;
  METRIC_FORMAT_BYTES = 1;
  METRIC_FORMAT_INTEGER = 2;
  METRIC_FORMAT_DURATION_SECONDS = 3;
  METRIC_FORMAT_PERCENT = 4;
}

message TerminalSize {
  uint32 rows = 1;
  uint32 columns = 2;
}

message IdOrNameValue {
  oneof id_or_name {
    uint32 id = 1;
    string name = 2;
  }
}

message NetworkReservation {
  string uuid = 1;
  string ipv4 = 2;
  string ipv6 = 3;
  string mac = 4;
  string gateway_ipv4 = 5;
  string gateway_ipv6 = 6;
  string gateway_mac = 7;
}

message ServiceEntry {
  string zone_id = 1;
  string service_name = 2;
}

message WorkloadSpec {
  string name = 1;
  string zone_id = 2;
  OciImageSpec image = 3;
  ProcessSpec process = 4;
  repeated AnnotationSpec annotations = 5;
  repeated MountSpec mounts = 6;
  WorkloadSecuritySpec security = 7;
  repeated WorkloadScratchMount scratch_mount = 8;
  repeated CgroupLimit cgroup_limits = 9;
  string hostname = 10;
  repeated WorkloadBlockDeviceSpec block_devices = 11;
  optional int32 oom_score_adj = 12;
  repeated WorkloadPciDeviceSpec pci_devices = 13;
  ObjectCapabilitySpec object_capabilities = 14;
}

// Object-capability grants for a workload. Privilege is reached by connecting
// to an endpoint, not by holding a credential. A workload may publish
// capabilities it holds (each backed by a supervised capsudod) and receive
// capabilities published elsewhere (each projected as a /run/ocap/<name>
// socket, bridged to the provider over IDM).
message ObjectCapabilitySpec {
  // Capabilities this workload offers to others.
  repeated ObjectCapabilityPublishSpec publishes = 1;
  // Capabilities this workload consumes, by name (e.g.
  // "dev.edera/whatever/deploy"). A receive that cannot be resolved is fatal:
  // the workload will not start, because the capability is a prerequisite.
  repeated string receives = 2;
}

// A single capability a workload publishes. Mirrors capsudod's attenuation:
// a fixed command/environment and whether the client may influence them.
message ObjectCapabilityPublishSpec {
  // Capability identity, e.g. "dev.edera/whatever/deploy". Determines the
  // /run/ocap/<name> socket path projected into receiving workloads.
  string name = 1;
  // Fixed program and arguments. Empty means the client supplies argv.
  repeated string command = 2;
  // Fixed environment entries injected into every invocation.
  repeated EnvironmentVariableSpec environment = 3;
  // capsudod -f: ignore client-supplied argv and run `command` verbatim.
  bool no_client_argv = 4;
  // capsudod -E: ignore client-supplied environment.
  bool no_client_env = 5;
  // Run the delegated child as this uid/gid. Unset runs as the capsudod uid.
  optional uint32 run_as_uid = 6;
  optional uint32 run_as_gid = 7;
  // Working directory for the delegated child. Empty leaves it unchanged.
  string working_dir = 8;
}

// Status of one published object capability, for discovery/observability.
message ObjectCapabilityInfo {
  // Capability identity, e.g. "dev.edera/whatever/deploy".
  string name = 1;
  // The zone whose agent supervises the backing capsudod.
  string provider_zone_id = 2;
  // The publishing workload within that zone.
  string provider_workload_id = 3;
  // Whether the backing capsudod is up and accepting connections.
  bool ready = 4;
}

message CgroupLimit {
  string limit_name = 1;
  string value = 2;
}

message WorkloadScratchMount {
  string path = 1;
}

enum SeccompProfileType {
  // No seccomp filter (also the default when unset).
  SECCOMP_PROFILE_TYPE_UNCONFINED = 0;
  // The runtime's built-in default profile.
  SECCOMP_PROFILE_TYPE_RUNTIME_DEFAULT = 1;
  // A profile loaded from a file on the node (see seccomp_localhost_ref).
  SECCOMP_PROFILE_TYPE_LOCALHOST = 2;
}

message WorkloadSecuritySpec {
  bool strict_user_namespace = 1;
  repeated string raise_capabilities = 2;
  repeated string raise_ambient_capabilities = 3;
  repeated string drop_capabilities = 4;
  bool privileged = 5;
  bool disable_all_namespaces = 6;
  repeated ProcessNamespace disable_namespaces = 7;
  bool read_only_rootfs = 8;
  bool no_new_privs = 9;
  SeccompProfileType seccomp_profile_type = 10;
  // Path to the localhost seccomp profile, relative to the kubelet seccomp
  // root; set only when seccomp_profile_type == SECCOMP_PROFILE_TYPE_LOCALHOST.
  string seccomp_localhost_ref = 11;
  AppArmorProfileType apparmor_profile_type = 12;
  // A fully-resolved seccomp filter, used instead of seccomp_profile_type/
  // seccomp_localhost_ref by callers that have already resolved the actual
  // syscall rules themselves and have no symbolic type/path left to describe
  // it with (e.g. a containerd v2 shim: containerd's own CRI plugin resolves
  // RuntimeDefault/Localhost into the OCI spec's `linux.seccomp` before ever
  // invoking the shim, so the shim only ever sees the resolved rules, never a
  // type or a profile path). When set, this is compiled and enforced
  // verbatim, and seccomp_profile_type/seccomp_localhost_ref are ignored.
  optional ResolvedSeccompProfile resolved_seccomp_profile = 13;
}

// Mirrors a resolved OCI LinuxSeccomp filter field-for-field, so a caller
// that already has one (see WorkloadSecuritySpec.resolved_seccomp_profile)
// can hand it over directly instead of re-deriving a symbolic type/path.
message ResolvedSeccompProfile {
  // e.g. "SCMP_ACT_ERRNO", "SCMP_ACT_ALLOW" (OCI's LinuxSeccompAction, as its
  // own wire string).
  string default_action = 1;
  optional uint32 default_errno_ret = 2;
  // e.g. "SCMP_ARCH_X86_64". Empty means "all/native" (OCI's default).
  repeated string architectures = 3;
  repeated ResolvedSeccompSyscallRule syscalls = 4;
}

message ResolvedSeccompSyscallRule {
  repeated string names = 1;
  string action = 2;
  optional uint32 errno_ret = 3;
  repeated ResolvedSeccompSyscallArg args = 4;
}

message ResolvedSeccompSyscallArg {
  uint32 index = 1;
  uint64 value = 2;
  optional uint64 value_two = 3;
  // e.g. "SCMP_CMP_EQ" (OCI's LinuxSeccompOperator).
  string op = 4;
}

// We do not support custom Localhost AppArmor policies.
// Only RuntimeDefault, and Unconfined.
enum AppArmorProfileType {
  // No AppArmor confinement (also the default when unset).
  APP_ARMOR_PROFILE_TYPE_UNCONFINED = 0;
  // The Edera runtime's built-in default profile.
  APP_ARMOR_PROFILE_TYPE_RUNTIME_DEFAULT = 1;
}

