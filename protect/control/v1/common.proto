  OCI_IMAGE_PROGRESS_LAYER_PHASE_DOWNLOADED = 3;
  OCI_IMAGE_PROGRESS_LAYER_PHASE_EXTRACTING = 4;
  OCI_IMAGE_PROGRESS_LAYER_PHASE_EXTRACTED = 5;
